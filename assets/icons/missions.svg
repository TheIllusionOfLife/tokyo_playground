<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Clipboard/checklist icon - white silhouette on transparent -->
  <g fill="white">
    <!-- Clipboard body -->
    <rect x="12" y="10" width="40" height="48" rx="4"/>
    <!-- Clip at top -->
    <rect x="24" y="6" width="16" height="10" rx="3"/>
    <!-- Check lines (dark cutouts) -->
    <rect x="20" y="24" width="6" height="6" rx="1" fill="#222"/>
    <rect x="30" y="25" width="16" height="4" rx="1" fill="#222"/>
    <rect x="20" y="35" width="6" height="6" rx="1" fill="#222"/>
    <rect x="30" y="36" width="16" height="4" rx="1" fill="#222"/>
    <rect x="20" y="46" width="6" height="6" rx="1" fill="#222"/>
    <rect x="30" y="47" width="16" height="4" rx="1" fill="#222"/>
  </g>
</svg>

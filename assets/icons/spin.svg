<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Lucky wheel/star icon - white silhouette on transparent -->
  <g fill="white">
    <!-- Outer wheel circle -->
    <circle cx="32" cy="32" r="26" fill="none" stroke="white" stroke-width="4"/>
    <!-- Wheel dividers (8 spokes) -->
    <line x1="32" y1="6" x2="32" y2="58" stroke="white" stroke-width="2"/>
    <line x1="6" y1="32" x2="58" y2="32" stroke="white" stroke-width="2"/>
    <line x1="13.6" y1="13.6" x2="50.4" y2="50.4" stroke="white" stroke-width="2"/>
    <line x1="50.4" y1="13.6" x2="13.6" y2="50.4" stroke="white" stroke-width="2"/>
    <!-- Center hub -->
    <circle cx="32" cy="32" r="6" fill="white"/>
    <!-- Pointer arrow at top -->
    <polygon points="32,2 28,10 36,10"/>
  </g>
</svg>

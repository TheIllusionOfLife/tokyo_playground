<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Stopwatch/clock icon - white silhouette on transparent -->
  <g fill="white" stroke="white">
    <!-- Clock face -->
    <circle cx="32" cy="34" r="24" fill="none" stroke-width="4"/>
    <!-- Top button -->
    <rect x="29" y="4" width="6" height="8" rx="2"/>
    <!-- Side button -->
    <rect x="48" y="16" width="8" height="4" rx="1" transform="rotate(30 52 18)"/>
    <!-- Hour hand -->
    <line x1="32" y1="34" x2="32" y2="20" stroke-width="4" stroke-linecap="round"/>
    <!-- Minute hand -->
    <line x1="32" y1="34" x2="44" y2="34" stroke-width="3" stroke-linecap="round"/>
    <!-- Center dot -->
    <circle cx="32" cy="34" r="3" fill="white"/>
  </g>
</svg>

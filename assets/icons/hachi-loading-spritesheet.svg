<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 256" width="512" height="256">
  <!--
    Hachi (Akita Inu) bouncing animation spritesheet.
    8 frames in a 4x2 grid. Each frame is 128x128px.
    Export to PNG at 512x256 for Roblox upload.
    Animate via ImageRectOffset: (frame%4)*128, floor(frame/4)*128
    ImageRectSize: 128, 128
  -->

  <!-- Frame 0 (0,0): Standing neutral -->
  <g transform="translate(0,0)">
    <g fill="white" transform="translate(64,64)">
      <ellipse cx="0" cy="2" rx="24" ry="22"/>
      <polygon points="-16,-18 -10,-28 -6,-10"/>
      <polygon points="16,-18 10,-28 6,-10"/>
      <ellipse cx="-8" cy="-2" rx="3" ry="3.5" fill="#222"/>
      <ellipse cx="8" cy="-2" rx="3" ry="3.5" fill="#222"/>
      <ellipse cx="0" cy="8" rx="4" ry="3" fill="#222"/>
      <rect x="-14" y="22" width="8" height="14" rx="3"/>
      <rect x="6" y="22" width="8" height="14" rx="3"/>
    </g>
  </g>

  <!-- Frame 1 (128,0): Starting bounce (crouch) -->
  <g transform="translate(128,0)">
    <g fill="white" transform="translate(64,68)">
      <ellipse cx="0" cy="2" rx="24" ry="20"/>
      <polygon points="-16,-16 -10,-26 -6,-8"/>
      <polygon points="16,-16 10,-26 6,-8"/>
      <ellipse cx="-8" cy="-2" rx="3" ry="3.5" fill="#222"/>
      <ellipse cx="8" cy="-2" rx="3" ry="3.5" fill="#222"/>
      <ellipse cx="0" cy="8" rx="4" ry="3" fill="#222"/>
      <rect x="-14" y="18" width="8" height="10" rx="3"/>
      <rect x="6" y="18" width="8" height="10" rx="3"/>
    </g>
  </g>

  <!-- Frame 2 (256,0): Mid-bounce (up) -->
  <g transform="translate(256,0)">
    <g fill="white" transform="translate(64,54)">
      <ellipse cx="0" cy="2" rx="24" ry="22"/>
      <polygon points="-16,-18 -10,-28 -6,-10"/>
      <polygon points="16,-18 10,-28 6,-10"/>
      <ellipse cx="-8" cy="-2" rx="3" ry="3.5" fill="#222"/>
      <ellipse cx="8" cy="-2" rx="3" ry="3.5" fill="#222"/>
      <ellipse cx="0" cy="8" rx="4" ry="3" fill="#222"/>
      <rect x="-14" y="22" width="8" height="14" rx="3"/>
      <rect x="6" y="22" width="8" height="14" rx="3"/>
    </g>
  </g>

  <!-- Frame 3 (384,0): Peak bounce (highest) -->
  <g transform="translate(384,0)">
    <g fill="white" transform="translate(64,46)">
      <ellipse cx="0" cy="2" rx="24" ry="22"/>
      <polygon points="-16,-18 -10,-30 -6,-10"/>
      <polygon points="16,-18 10,-30 6,-10"/>
      <ellipse cx="-8" cy="-2" rx="3" ry="3" fill="#222"/>
      <ellipse cx="8" cy="-2" rx="3" ry="3" fill="#222"/>
      <ellipse cx="0" cy="8" rx="4" ry="3" fill="#222"/>
      <path d="M-6 12 Q0 16 6 12" fill="none" stroke="#222" stroke-width="2"/>
      <rect x="-16" y="22" width="8" height="12" rx="3" transform="rotate(-8 -12 28)"/>
      <rect x="8" y="22" width="8" height="12" rx="3" transform="rotate(8 12 28)"/>
    </g>
  </g>

  <!-- Frame 4 (0,128): Descending -->
  <g transform="translate(0,128)">
    <g fill="white" transform="translate(64,52)">
      <ellipse cx="0" cy="2" rx="24" ry="22"/>
      <polygon points="-16,-18 -10,-28 -6,-10"/>
      <polygon points="16,-18 10,-28 6,-10"/>
      <ellipse cx="-8" cy="-2" rx="3" ry="3.5" fill="#222"/>
      <ellipse cx="8" cy="-2" rx="3" ry="3.5" fill="#222"/>
      <ellipse cx="0" cy="8" rx="4" ry="3" fill="#222"/>
      <rect x="-14" y="22" width="8" height="14" rx="3"/>
      <rect x="6" y="22" width="8" height="14" rx="3"/>
    </g>
  </g>

  <!-- Frame 5 (128,128): Landing (squish) -->
  <g transform="translate(128,128)">
    <g fill="white" transform="translate(64,70)">
      <ellipse cx="0" cy="0" rx="26" ry="18"/>
      <polygon points="-16,-14 -10,-22 -6,-6"/>
      <polygon points="16,-14 10,-22 6,-6"/>
      <ellipse cx="-8" cy="-2" rx="3" ry="3" fill="#222"/>
      <ellipse cx="8" cy="-2" rx="3" ry="3" fill="#222"/>
      <ellipse cx="0" cy="6" rx="4" ry="2.5" fill="#222"/>
      <rect x="-16" y="16" width="9" height="8" rx="3"/>
      <rect x="7" y="16" width="9" height="8" rx="3"/>
    </g>
  </g>

  <!-- Frame 6 (256,128): Recovery (stretch up) -->
  <g transform="translate(256,128)">
    <g fill="white" transform="translate(64,62)">
      <ellipse cx="0" cy="2" rx="22" ry="24"/>
      <polygon points="-14,-20 -8,-30 -4,-12"/>
      <polygon points="14,-20 8,-30 4,-12"/>
      <ellipse cx="-8" cy="-2" rx="3" ry="3.5" fill="#222"/>
      <ellipse cx="8" cy="-2" rx="3" ry="3.5" fill="#222"/>
      <ellipse cx="0" cy="8" rx="4" ry="3" fill="#222"/>
      <rect x="-12" y="24" width="7" height="14" rx="3"/>
      <rect x="5" y="24" width="7" height="14" rx="3"/>
    </g>
  </g>

  <!-- Frame 7 (384,128): Return to neutral -->
  <g transform="translate(384,128)">
    <g fill="white" transform="translate(64,66)">
      <ellipse cx="0" cy="2" rx="24" ry="22"/>
      <polygon points="-16,-18 -10,-28 -6,-10"/>
      <polygon points="16,-18 10,-28 6,-10"/>
      <ellipse cx="-8" cy="-2" rx="3" ry="3.5" fill="#222"/>
      <ellipse cx="8" cy="-2" rx="3" ry="3.5" fill="#222"/>
      <ellipse cx="0" cy="8" rx="4" ry="3" fill="#222"/>
      <rect x="-14" y="22" width="8" height="12" rx="3"/>
      <rect x="6" y="22" width="8" height="12" rx="3"/>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Rickshaw - white silhouette -->
  <g fill="white">
    <!-- Canopy/roof -->
    <path d="M14 16 Q32 4 50 16 L48 24 H16 Z"/>
    <!-- Seat back -->
    <rect x="16" y="24" width="32" height="16" rx="3"/>
    <!-- Seat bottom -->
    <rect x="14" y="38" width="36" height="6" rx="2"/>
    <!-- Left handle/shaft -->
    <line x1="14" y1="40" x2="4" y2="52" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <!-- Right handle/shaft -->
    <line x1="50" y1="40" x2="60" y2="52" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <!-- Wheel -->
    <circle cx="32" cy="52" r="8"/>
    <circle cx="32" cy="52" r="4" fill="#222"/>
    <!-- Spokes -->
    <line x1="32" y1="44" x2="32" y2="60" stroke="#222" stroke-width="1.5"/>
    <line x1="24" y1="52" x2="40" y2="52" stroke="#222" stroke-width="1.5"/>
  </g>
</svg>

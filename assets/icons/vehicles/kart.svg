<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Go-kart silhouette - white on transparent -->
  <g fill="white">
    <!-- Body (low, wide) -->
    <rect x="8" y="28" width="48" height="14" rx="4"/>
    <!-- Cockpit/seat area -->
    <rect x="22" y="20" width="16" height="12" rx="3"/>
    <!-- Front spoiler -->
    <rect x="4" y="36" width="12" height="4" rx="2"/>
    <!-- Rear spoiler -->
    <rect x="48" y="36" width="12" height="4" rx="2"/>
    <!-- Steering wheel -->
    <circle cx="28" cy="26" r="3" fill="#222"/>
    <!-- Left front wheel -->
    <circle cx="14" cy="46" r="6"/>
    <circle cx="14" cy="46" r="3" fill="#222"/>
    <!-- Right front wheel -->
    <circle cx="50" cy="46" r="6"/>
    <circle cx="50" cy="46" r="3" fill="#222"/>
  </g>
</svg>

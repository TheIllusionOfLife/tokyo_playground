<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Onigiri (rice ball) - white triangle with nori band -->
  <g fill="white">
    <!-- Rice triangle body -->
    <path d="M32 6 L56 52 Q56 58 50 58 H14 Q8 58 8 52 Z"/>
    <!-- Nori (seaweed) band at bottom -->
    <rect x="14" y="38" width="36" height="16" rx="2" fill="#666"/>
    <!-- Rice texture dots -->
    <circle cx="28" cy="20" r="1" fill="#ddd"/>
    <circle cx="36" cy="24" r="1" fill="#ddd"/>
    <circle cx="30" cy="28" r="1" fill="#ddd"/>
    <circle cx="38" cy="18" r="1" fill="#ddd"/>
    <!-- Cute face (optional, dark cutouts) -->
    <circle cx="26" cy="32" r="2.5" fill="#222"/>
    <circle cx="38" cy="32" r="2.5" fill="#222"/>
    <path d="M30 36 Q32 39 34 36" fill="none" stroke="#222" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
